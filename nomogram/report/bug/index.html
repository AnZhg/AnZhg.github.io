<!-- Nomogram's Help > Report a Bug… opens this page with version and macos in the query; it forwards them to the issue
     form, whose fields have those ids. -->
<meta charset="utf-8">
<title>Report a bug in Nomogram</title>
<script>
    var query = new URLSearchParams(location.search);
    query.set("template", "nomogram-bug.yml");
    location.replace("https://github.com/AnZhg/AnZhg.github.io/issues/new?" + query.toString());
</script>
<p><a href="https://github.com/AnZhg/AnZhg.github.io/issues/new?template=nomogram-bug.yml">Open the form to report a bug</a></p>
